[project]
name = "avanti-mcp-postgres"
version = "0.1.0"
description = "Read-only PostgreSQL MCP server for Avanti Fellows DB Service"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "asyncpg>=0.29.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
avanti-mcp-postgres = "mcp_postgres.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_postgres"]

[project.optional-dependencies]
dev = ["pytest"]
